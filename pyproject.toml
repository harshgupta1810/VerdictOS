[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdictos"
version = "0.1.0"
description = "Multi-agent system for transaction validation and M&A due diligence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "elasticsearch>=8.12.0,<9.0.0",
    "spacy>=3.7.4",
    "networkx>=3.2.1",
    "rapidfuzz>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
extraPaths = ["."]


